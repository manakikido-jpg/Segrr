<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:260px;flex:none;align-self:stretch;display:flex;flex-direction:column;background:{{ bg }};border-right:1px solid {{ border }};font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI','Noto Sans JP',sans-serif">
  <div style="height:64px;flex:none;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid {{ border }}">
    <img src="logo.png" alt="" style="width:26px;height:26px;object-fit:contain;filter:{{ logoFilter }}">
    <span style="font-size:18px;font-weight:600;letter-spacing:-.01em;color:{{ strong }}">Segrr</span>
  </div>
  <div style="padding:16px 12px;display:flex;flex-direction:column;gap:2px">
    <span style="padding:0 10px 8px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:{{ muted }}">Workspace</span>
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="7">
      <div style="display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:8px;background:{{ it.bg }};color:{{ it.fg }};font-size:14px;font-weight:{{ it.weight }}">
        <span style="width:18px;height:18px;flex:none;display:flex;align-items:center;justify-content:center">{{ it.icon }}</span>
        <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ it.label }}</span>
        <sc-if value="{{ it.hasCount }}" hint-placeholder-val="{{ true }}">
          <span style="min-width:22px;height:20px;padding:0 6px;border-radius:999px;background:{{ it.countBg }};color:{{ it.countFg }};display:inline-flex;align-items:center;justify-content:center;font-family:ui-monospace,SFMono-Regular,monospace;font-variant-numeric:tabular-nums;font-size:11px;font-weight:500">{{ it.count }}</span>
        </sc-if>
      </div>
    </sc-for>
  </div>
  <div style="flex:1"></div>
  <div style="display:flex;align-items:center;gap:10px;padding:16px 20px;border-top:1px solid {{ border }}">
    <div style="width:32px;height:32px;flex:none;border-radius:999px;background:{{ avatarBg }};color:{{ avatarFg }};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600">田</div>
    <div style="display:flex;flex-direction:column;min-width:0">
      <span style="font-size:13px;font-weight:500;color:{{ strong }}">田中 諒</span>
      <span style="font-size:12px;color:{{ muted }};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">ryo@example.jp</span>
    </div>
    <span style="margin-left:auto;font-size:12px;color:{{ muted }}">⌄</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:600},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dashboard&quot;,&quot;clients&quot;,&quot;projects&quot;,&quot;quotes&quot;,&quot;contracts&quot;,&quot;invoices&quot;,&quot;settings&quot;],&quot;default&quot;:&quot;dashboard&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  icon(name, color) {
    const d = {
      dashboard: 'M3 10.5 9 4.5l6 6V15a.6.6 0 0 1-.6.6h-3.3v-4.2H6.9v4.2H3.6A.6.6 0 0 1 3 15v-4.5Z',
      clients: 'M9 8.4a2.4 2.4 0 1 0 0-4.8 2.4 2.4 0 0 0 0 4.8Zm-5 6.2c0-2.4 2.3-3.8 5-3.8s5 1.4 5 3.8',
      projects: 'M2.7 6h12.6v8.4H2.7zM6.6 6V4.2a.6.6 0 0 1 .6-.6h3.6a.6.6 0 0 1 .6.6V6',
      quotes: 'M4.5 2.7h6l3 3v9.6h-9zM6.9 8.1h4.2M6.9 11.1h4.2',
      contracts: 'M4.5 2.7h9v12.6h-9zM6.9 6.6h4.2M6.9 9.3h4.2M6.9 12h2.4',
      invoices: 'M3.9 3.3h10.2v11.4l-2.4-1.4-2.3 1.4-2.4-1.4-3.1 1.4zM6.6 6.9h4.8M6.6 9.9h3.6',
      settings: 'M9 11.4a2.4 2.4 0 1 0 0-4.8 2.4 2.4 0 0 0 0 4.8Zm6-2.4-1.3-.3a5 5 0 0 0-.6-1.4l.7-1.2-1.3-1.3-1.2.7a5 5 0 0 0-1.4-.6L9.6 3H8.4l-.3 1.2a5 5 0 0 0-1.4.6l-1.2-.7L4.2 5.4l.7 1.2a5 5 0 0 0-.6 1.4L3 8.4v1.2l1.3.3a5 5 0 0 0 .6 1.4l-.7 1.2 1.3 1.3 1.2-.7a5 5 0 0 0 1.4.6L8.4 15h1.2l.3-1.3a5 5 0 0 0 1.4-.6l1.2.7 1.3-1.3-.7-1.2a5 5 0 0 0 .6-1.4L15 9.6V9Z'
    }[name];
    return React.createElement('svg', { width: 18, height: 18, viewBox: '0 0 18 18', fill: 'none' },
      React.createElement('path', { d, stroke: color, strokeWidth: 1.5, strokeLinecap: 'round', strokeLinejoin: 'round' }));
  }
  renderVals() {
    const dark = !!this.props.dark;
    const t = dark
      ? { bg:'#171717', border:'#404040', strong:'#f5f5f5', muted:'#a3a3a3', idle:'#a3a3a3',
          activeBg:'#262626', activeFg:'#ffffff', countBg:'#404040', countFg:'#e5e5e5',
          avatarBg:'#3b82f6', avatarFg:'#ffffff' }
      : { bg:'#ffffff', border:'#d1d5db', strong:'#1f2937', muted:'#4b5563', idle:'#4b5563',
          activeBg:'#f3f4f6', activeFg:'#1f2937', countBg:'#f1f2f4', countFg:'#374151',
          avatarBg:'#1d4ed8', avatarFg:'#ffffff' };
    const defs = [
      ['dashboard','ダッシュボード',''],
      ['clients','顧客','24'],
      ['projects','案件','8'],
      ['quotes','見積書','12'],
      ['contracts','契約書','6'],
      ['invoices','請求書','19'],
      ['settings','設定','']
    ];
    const active = this.props.active || 'dashboard';
    return {
      ...t,
      logoFilter: dark ? 'invert(1)' : 'none',
      items: defs.map(([k, label, count]) => {
        const on = k === active;
        return {
          label, count, hasCount: !!count,
          bg: on ? t.activeBg : 'transparent',
          fg: on ? t.activeFg : t.strong,
          weight: on ? 600 : 400,
          countBg: on ? (dark ? '#525252' : '#d1d5db') : t.countBg,
          countFg: t.countFg,
          icon: this.icon(k, on ? (dark ? '#60a5fa' : '#2563eb') : t.idle)
        };
      })
    };
  }
}
</script>
</body>
</html>
